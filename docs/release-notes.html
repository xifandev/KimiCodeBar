<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KimiCodeBar 更新日志</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      line-height: 1.6;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .thanks {
      font-size: 14px;
      color: #8b949e;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: rgba(88, 166, 255, 0.08);
      border-radius: 8px;
      border: 1px solid rgba(88, 166, 255, 0.2);
    }
    .thanks a {
      color: #58a6ff;
      text-decoration: none;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    li {
      position: relative;
      padding-left: 18px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #c9d1d9;
    }
    li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #58a6ff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <li>新增 WorkBuddy 平台集成：面板积分卡片、每日自动签到、一键启动并切换客户端账号。</li> <li>新增 DeepSeek 平台余额监控：API Key 添加账号，面板实时展示余额并支持多账号。</li> <li>新增多账号显示风格切换：经典 / 极简两种菜单栏样式可选。</li> <li>账号管理支持拖拽排序，添加账号改为独立弹窗，平台卡片两列布局。</li> <li>本机消耗量 7 天档改为柱状图展示，修复悬停提示错位的问题。</li> <li>修复多账号体系下 OAuth 授权偶发失效的问题。</li> 
</body>
</html>
